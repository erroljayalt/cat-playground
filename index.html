<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marmalade &amp; Smokey</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: full-bleed 3D yard; a name tag top-left, a toy-bar of actions along the bottom. */
:root{
  --sky:#3a3430;
  --panel:rgba(255,252,246,.86);
  --ink:#2a2420;
  --muted:#6d625a;
  --accent:#e0782f;
  --accent-ink:#ffffff;
  --chip:#fff;
  --line:rgba(60,40,20,.14);
  --cat1:#e0782f;
  --cat2:#6f747c;
  --display:"Fredoka", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#3a3430; --panel:rgba(28,30,36,.86); --ink:#f3ece4; --muted:#b9ada2;
    --accent:#f08c45; --accent-ink:#1d140d; --chip:#2b2e36; --line:rgba(255,230,200,.16);
    --cat1:#f08c45; --cat2:#a9aeb6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#3a3430; --panel:rgba(28,30,36,.86); --ink:#f3ece4; --muted:#b9ada2;
  --accent:#f08c45; --accent-ink:#1d140d; --chip:#2b2e36; --line:rgba(255,230,200,.16);
  --cat1:#f08c45; --cat2:#a9aeb6; color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--body)}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}

.tag{
  position:fixed;
  top:calc(16px + env(safe-area-inset-top,0px));
  left:max(16px, env(safe-area-inset-left,0px));
  background:var(--panel);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:14px;
  padding:10px 14px;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 32px);
}
.tag h1{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 2px;letter-spacing:.2px}
.tag .doing{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tag .doing b{font-weight:600;color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.c1{background:var(--cat1)}
.dot.c2{background:var(--cat2)}
.tag .dot{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}

.bar{
  position:fixed;left:0;right:0;
  bottom:0;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex;justify-content:center;pointer-events:none;
}
.bar-inner{
  pointer-events:auto;background:var(--panel);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:18px;padding:10px;
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:800px;
}
.bar button,.bar label{
  font-family:var(--display);font-weight:500;font-size:14px;
  border:1px solid var(--line);background:var(--chip);color:var(--ink);
  border-radius:999px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.bar button:hover{border-color:var(--accent)}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.who{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px;background:var(--chip)}
.bar .who button{border:none;padding:5px 11px;background:transparent}
.bar .who button.on{background:var(--ink);color:var(--chip)}
.bar .sep{width:1px;background:var(--line);margin:2px 2px}
.bar .row{width:100%;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
.bar .lbl{font-family:var(--display);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.bar input{accent-color:var(--accent);margin:0}
.hint{font-size:12px;color:var(--muted);width:100%;text-align:center}
@media (max-width:520px){
  .bar button,.bar label{font-size:13px;padding:6px 10px}
  .bar .sep{display:none}
}
</style>

<div id="stage"></div>

<div class="tag" aria-live="polite">
  <h1>Marmalade &amp; Smokey</h1>
  <div class="doing"><span class="dot c1"></span><b>Marmalade</b><span id="status-0">Waking up</span></div>
  <div class="doing"><span class="dot c2"></span><b>Smokey</b><span id="status-1">Waking up</span></div>
</div>

<div class="bar">
  <div class="bar-inner">
    <div class="row">
      <span class="lbl">Place</span>
      <div class="who" role="group" aria-label="Where the cats play">
        <button id="p-bedroom" data-place="bedroom">Bedroom</button>
        <button id="p-yard" data-place="yard">Yard</button>
        <button id="p-beach" data-place="beach">Beach</button>
        <button id="p-snow" data-place="snow">Snowy garden</button>
      </div>
    </div>
    <div class="who" role="group" aria-label="Which cat the buttons control">
      <button id="w-0" data-who="0"><span class="dot c1"></span>Marmalade</button>
      <button id="w-1" data-who="1"><span class="dot c2"></span>Smokey</button>
      <button id="w-both" data-who="both" class="on">Both</button>
    </div>
    <button id="b-auto" class="on" data-act="auto" aria-pressed="true">Autoplay</button>
    <span class="sep"></span>
    <button id="b-chase" data-act="chase">Chase</button>
    <button id="b-pounce" data-act="pounce">Pounce</button>
    <button id="b-roll" data-act="roll">Roll over</button>
    <button id="b-zoom" data-act="zoom">Zoomies</button>
    <button id="b-tail" data-act="tailChase">Tail chase</button>
    <button id="b-stretch" data-act="stretch">Stretch</button>
    <button id="b-tag" data-act="chaseFriend">Play tag</button>
    <button id="b-nap" data-act="nap">Nap</button>
    <button id="b-throw" data-act="throw">Throw yarn</button>
    <span class="sep"></span>
    <label for="follow"><input type="checkbox" id="follow" checked> Follow cam</label>
    <div class="hint">Pick a cat, then an action · drag to orbit · scroll to zoom · tap the ground to drop the yarn</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (a, b, r, dt) => a + (b - a) * (1 - Math.exp(-r * dt));
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const ease = s => s < 0 ? 0 : s > 1 ? 1 : s * s * (3 - 2 * s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- renderer / scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a3430);

const camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.1, 120);
camera.position.set(6, 5.5, 9);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 2;
controls.maxDistance = 18;
controls.target.set(0, 0.5, 0);

const hemi = new THREE.HemisphereLight(0xfff6e8, 0x8a7560, 0.62); scene.add(hemi);
const ambient = new THREE.AmbientLight(0xffffff, 0.12); scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff1dc, 0.75);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 });
sun.shadow.bias = -0.0006;
scene.add(sun);

const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.9 }, o));
function add(parent, geo, material, pos, scale, rot, shadow = true) {
  const m = new THREE.Mesh(geo, material);
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (scale) m.scale.set(scale[0], scale[1], scale[2]);
  if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m);
  return m;
}

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  return new THREE.CanvasTexture(c);
}

// ---------- places ----------
// Each builder fills its own group and returns the place's floor, bounds, furniture
// footprints (obst), nap spots, start positions and lighting.
// bounds: { r } for a round play area, { hx, hz } for a rectangle.

function fence(g, R) {
  const wood = mat(0xc89a6a);
  const posts = new THREE.InstancedMesh(new THREE.BoxGeometry(0.1, 0.62, 0.1), wood, 72);
  posts.castShadow = true;
  const dummy = new THREE.Object3D();
  for (let i = 0; i < 72; i++) {
    const a = i / 72 * TAU;
    dummy.position.set(Math.cos(a) * R, 0.31, Math.sin(a) * R);
    dummy.rotation.set(0, -a, 0);
    dummy.updateMatrix();
    posts.setMatrixAt(i, dummy.matrix);
  }
  g.add(posts);
  for (const h of [0.22, 0.48]) add(g, new THREE.TorusGeometry(R, 0.035, 6, 120), wood, [0, h, 0], null, [Math.PI / 2, 0, 0]);
}

function buildYard() {
  const g = new THREE.Group();
  const R = 9.3;
  add(g, new THREE.CircleGeometry(60, 48), mat(0x86b862), [0, -0.01, 0], null, [-Math.PI / 2, 0, 0], false);
  const floor = add(g, new THREE.CircleGeometry(R, 72), mat(0x9bd06f), [0, 0, 0], null, [-Math.PI / 2, 0, 0], false);
  fence(g, R);
  const petalCols = [0xffffff, 0xffd34d, 0xff8fb1, 0xb69cff];
  for (let i = 0; i < 70; i++) {
    const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * (R - 0.6);
    add(g, new THREE.SphereGeometry(0.05, 8, 6), mat(petalCols[i % 4]), [Math.cos(a) * r, 0.04, Math.sin(a) * r], [1, 0.5, 1], null, false);
  }
  const leafCols = [0x4f9a4a, 0x5fae55, 0x3f8a46];
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * TAU + rand(-0.15, 0.15), r = rand(12.5, 18);
    const t = new THREE.Group(); t.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); g.add(t);
    const s = rand(0.8, 1.4);
    add(t, new THREE.CylinderGeometry(0.18 * s, 0.25 * s, 1.6 * s, 8), mat(0x8a5a3a), [0, 0.8 * s, 0]);
    add(t, new THREE.IcosahedronGeometry(1.1 * s, 0), mat(leafCols[i % 3], { flatShading: true }), [0, 2.2 * s, 0]);
    add(t, new THREE.IcosahedronGeometry(0.8 * s, 0), mat(leafCols[(i + 1) % 3], { flatShading: true }), [0.5 * s, 2.9 * s, 0.2 * s]);
  }
  for (let i = 0; i < 22; i++) {
    const a = rand(0, TAU), r = rand(10.2, 11.8);
    add(g, new THREE.IcosahedronGeometry(rand(0.4, 0.7), 0), mat(leafCols[i % 3], { flatShading: true }), [Math.cos(a) * r, 0.3, Math.sin(a) * r], [1, 0.8, 1]);
  }
  for (let i = 0; i < 7; i++) {
    const c = new THREE.Group();
    const a = rand(0, TAU), r = rand(18, 30);
    c.position.set(Math.cos(a) * r, rand(9, 14), Math.sin(a) * r);
    for (let k = 0; k < 4; k++) add(c, new THREE.SphereGeometry(rand(1, 1.8), 12, 10), mat(0xffffff, { roughness: 1 }), [k * 1.3 - 2, rand(-0.3, 0.4), rand(-0.5, 0.5)], null, null, false);
    g.add(c);
  }
  // a garden bench to nap under the shade of
  const bench = new THREE.Group(); bench.position.set(-3.5, 0, -4.5); bench.rotation.y = 0.6; g.add(bench);
  const benchWood = mat(0xb07a4f);
  for (const z of [-0.18, 0, 0.18]) add(bench, new THREE.BoxGeometry(1.8, 0.05, 0.14), benchWood, [0, 0.5, z]);
  for (const x of [-0.8, 0.8]) for (const z of [-0.2, 0.2]) add(bench, new THREE.BoxGeometry(0.07, 0.5, 0.07), mat(0x3e3e3e), [x, 0.25, z]);
  add(bench, new THREE.BoxGeometry(1.8, 0.4, 0.05), benchWood, [0, 0.8, -0.25]);
  return {
    group: g, floor, bounds: { r: R }, walls: [],
    obst: [{ x0: -4.4, x1: -2.6, z0: -5.3, z1: -3.7, h: 0.85 }], // bench
    nap: { x: -1.2, z: -2.6, y: 0, where: 'in a sunny patch' },
    napAlt: { x: 2.4, z: 2.6, y: 0, where: 'on the grass' },
    start: { cats: [[0.8, 0.4, 0.4], [-1.6, -1.2, 1.2]], ball: [2, 1.8] },
    cam: [5, 3.8, 7.5],
    light: { bg: 0xbfe3f2, fog: [0xbfe3f2, 22, 48], hemi: [0xffffff, 0x7a9a5a, 0.75], amb: 0, sun: [0xfff4e0, 0.95, [7, 12, 5]] },
  };
}

function buildBedroom() {
const scene = new THREE.Group();
const ROOM_W = 14, ROOM_D = 12, WALL_H = 3.6;
const HX = ROOM_W / 2, HZ = ROOM_D / 2;

const planks = canvasTex(512, 512, (x, W, H) => {
  const rows = 8, h = H / rows;
  for (let r = 0; r < rows; r++) {
    let u = -Math.random() * 200;
    while (u < W) {
      const len = rand(160, 300);
      x.fillStyle = `hsl(28, 40%, ${50 + rand(-7, 7)}%)`;
      x.fillRect(u, r * h, len, h);
      x.strokeStyle = 'rgba(90,55,25,.18)'; x.lineWidth = 1.5;
      for (let g = 0; g < 4; g++) {
        const gy = r * h + rand(6, h - 6);
        x.beginPath(); x.moveTo(u, gy);
        x.bezierCurveTo(u + len * 0.3, gy + rand(-4, 4), u + len * 0.7, gy + rand(-4, 4), u + len, gy);
        x.stroke();
      }
      x.fillStyle = 'rgba(60,35,15,.55)'; x.fillRect(u + len - 1.5, r * h, 3, h);
      u += len;
    }
    x.fillStyle = 'rgba(60,35,15,.6)'; x.fillRect(0, r * h, W, 2.5);
  }
});
planks.wrapS = planks.wrapT = THREE.RepeatWrapping; planks.repeat.set(3, 2.6); planks.anisotropy = 4;
const floor = add(scene, new THREE.PlaneGeometry(ROOM_W, ROOM_D), mat(0xffffff, { map: planks, roughness: 0.65 }), [0, 0, 0], null, [-Math.PI / 2, 0, 0], false);

const wallMat = mat(0xc9d6c3);
const trimMat = mat(0xf4f1ea);
const oak = mat(0xd2a679);
const walnut = mat(0x7a5236);
const offWhite = mat(0xf1ece2);

// walls on the camera's side hide themselves, like a dollhouse
const walls = [];
function wall(width, x, z, rotY, hide) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g);
  add(g, new THREE.BoxGeometry(width + 0.4, WALL_H, 0.2), wallMat, [0, WALL_H / 2, -0.1], null, null, false);
  add(g, new THREE.BoxGeometry(width, 0.16, 0.05), trimMat, [0, 0.08, 0.025], null, null, false);
  walls.push({ g, hide });
  return g;
}
// each wall's local +z faces into the room
const backWall = wall(ROOM_W, 0, -HZ, 0, () => camera.position.z < -HZ);           // local x = world x
const frontWall = wall(ROOM_W, 0, HZ, Math.PI, () => camera.position.z > HZ);      // local x = -world x
const leftWall = wall(ROOM_D, -HX, 0, Math.PI / 2, () => camera.position.x < -HX); // local x = -world z
const rightWall = wall(ROOM_D, HX, 0, -Math.PI / 2, () => camera.position.x > HX); // local x = world z

function artTexture(sky, hill1, hill2, sunCol) {
  return canvasTex(256, 160, (x, W, H) => {
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, sky); g.addColorStop(1, '#fff6e6');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = sunCol; x.beginPath(); x.arc(W * 0.7, H * 0.38, 22, 0, TAU); x.fill();
    x.fillStyle = hill1; x.beginPath(); x.moveTo(0, H); x.quadraticCurveTo(W * 0.3, H * 0.35, W * 0.65, H); x.fill();
    x.fillStyle = hill2; x.beginPath(); x.moveTo(W * 0.3, H); x.quadraticCurveTo(W * 0.75, H * 0.45, W, H * 0.8); x.lineTo(W, H); x.fill();
  });
}
function picture(parent, w, h, pos, tex) {
  add(parent, new THREE.BoxGeometry(w, h, 0.06), walnut, pos, null, null, false);
  add(parent, new THREE.PlaneGeometry(w - 0.14, h - 0.14), mat(0xffffff, { map: tex, roughness: 0.8 }), [pos[0], pos[1], pos[2] + 0.035], null, null, false);
}

// back wall: window with curtains, bookshelf, painting over the bed
{
  const win = new THREE.Group(); win.position.set(-1, 2.1, 0); backWall.add(win);
  const skyTex = canvasTex(256, 192, (x, W, H) => {
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#8fcbea'); g.addColorStop(1, '#e6f5fb');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(255,255,255,.9)';
    for (const [cx, cy, s] of [[60, 50, 1], [180, 80, 0.8], [120, 130, 0.6]])
      for (let i = 0; i < 4; i++) { x.beginPath(); x.ellipse(cx + i * 18 * s, cy + (i % 2) * 6, 22 * s, 13 * s, 0, 0, TAU); x.fill(); }
  });
  add(win, new THREE.PlaneGeometry(2.3, 1.7), new THREE.MeshBasicMaterial({ map: skyTex }), [0, 0, 0.02], null, null, false);
  for (const y of [-0.9, 0.9]) add(win, new THREE.BoxGeometry(2.5, 0.12, 0.12), trimMat, [0, y, 0.06], null, null, false);
  for (const x of [-1.2, 1.2]) add(win, new THREE.BoxGeometry(0.12, 1.9, 0.12), trimMat, [x, 0, 0.06], null, null, false);
  add(win, new THREE.BoxGeometry(0.06, 1.7, 0.06), trimMat, [0, 0, 0.06], null, null, false);
  add(win, new THREE.BoxGeometry(2.3, 0.06, 0.06), trimMat, [0, 0, 0.06], null, null, false);
  add(win, new THREE.BoxGeometry(2.7, 0.08, 0.3), trimMat, [0, -0.97, 0.15], null, null, false);
  add(win, new THREE.CylinderGeometry(0.025, 0.025, 4, 8), walnut, [0, 1.45, 0.18], null, [0, 0, Math.PI / 2], false);
  const curtain = mat(0xe7b29d, { roughness: 1 });
  for (const s of [-1, 1]) for (let k = 0; k < 6; k++)
    add(win, new THREE.CylinderGeometry(0.085, 0.1, 2.75, 10), curtain, [s * (1.3 + k * 0.12), 0.07, 0.16 + (k % 2) * 0.04], null, null, false);

  const shelf = new THREE.Group(); shelf.position.set(-4.8, 0, 0.26); backWall.add(shelf);
  for (const x of [-0.9, 0.9]) add(shelf, new THREE.BoxGeometry(0.05, 2.4, 0.5), offWhite, [x, 1.2, 0]);
  add(shelf, new THREE.BoxGeometry(1.8, 2.4, 0.03), offWhite, [0, 1.2, -0.235]);
  const bookCols = [0xc8553d, 0x2f5d62, 0xf2a541, 0x5873a8, 0x8b5e83, 0xe8d7b5, 0x3e3e3e];
  [0.03, 0.62, 1.22, 1.82, 2.38].forEach((y, si) => {
    add(shelf, new THREE.BoxGeometry(1.8, 0.05, 0.5), offWhite, [0, y, 0]);
    if (si === 4) return;
    let x = -0.84;
    while (x < 0.8) {
      const w = rand(0.06, 0.12), h = rand(0.3, 0.44);
      if (si === 2 && x > 0.3) { // a small plant on the middle shelf
        add(shelf, new THREE.CylinderGeometry(0.1, 0.08, 0.16, 12), mat(0xc8714d), [0.55, y + 0.105, 0]);
        add(shelf, new THREE.IcosahedronGeometry(0.17, 0), mat(0x5fae55, { flatShading: true }), [0.55, y + 0.3, 0]);
        break;
      }
      add(shelf, new THREE.BoxGeometry(w, h, 0.34), mat(bookCols[Math.floor(Math.random() * bookCols.length)]), [x + w / 2, y + 0.025 + h / 2, 0.02], null, [0, 0, x > 0.6 ? 0.12 : 0]);
      x += w + 0.008;
    }
  });
  picture(backWall, 1.5, 1.0, [3.4, 2.6, 0.03], artTexture('#f6c7a8', '#7fa77a', '#4f7f6a', '#f28f5c'));
}

// left wall: wardrobe and two small pictures
{
  const ward = new THREE.Group(); ward.position.set(2, 0, 0.5); leftWall.add(ward);
  add(ward, new THREE.BoxGeometry(3.0, 0.12, 0.95), walnut, [0, 0.06, 0]);
  add(ward, new THREE.BoxGeometry(3.0, 3.1, 1.0), oak, [0, 1.67, 0]);

function buildBeach() {
  const g = new THREE.Group();
  const HX = 8.5, HZ = 5.5;
  const sandTex = canvasTex(256, 256, (x, W, H) => {
    x.fillStyle = '#f0d9a6'; x.fillRect(0, 0, W, H);
    for (let i = 0; i < 1400; i++) {
      x.fillStyle = Math.random() < 0.5 ? 'rgba(180,140,80,.35)' : 'rgba(255,250,235,.5)';
      x.fillRect(Math.random() * W, Math.random() * H, 2, 2);
    }
  });
  sandTex.wrapS = sandTex.wrapT = THREE.RepeatWrapping; sandTex.repeat.set(10, 10);
  const floor = add(g, new THREE.PlaneGeometry(60, 40), mat(0xffffff, { map: sandTex, roughness: 1 }), [0, 0, 8], null, [-Math.PI / 2, 0, 0], false);
  add(g, new THREE.PlaneGeometry(60, 1.6), mat(0xd6b67f, { roughness: 0.7 }), [0, 0.004, -HZ - 0.3], null, [-Math.PI / 2, 0, 0], false);

  // sea with rolling swell
  const seaGeo = new THREE.PlaneGeometry(80, 34, 80, 34);
  const sea = add(g, seaGeo, mat(0x35aec4, { roughness: 0.25, metalness: 0.1, transparent: true, opacity: 0.92, flatShading: true }), [0, 0.02, -HZ - 17.6], null, [-Math.PI / 2, 0, 0], false);
  const seaBase = seaGeo.attributes.position.array.slice();
  const foam = [];
  for (let i = 0; i < 9; i++) foam.push(add(g, new THREE.BoxGeometry(rand(2, 5), 0.03, 0.18), mat(0xffffff, { roughness: 0.6 }), [i * 6.5 - 26 + rand(-1, 1), 0.05, -HZ - 0.85], null, null, false));

  // palms
  function palm(x, z, lean) {
    const p = new THREE.Group(); p.position.set(x, 0, z); p.rotation.y = rand(0, TAU); g.add(p);
    let y = 0, off = 0;
    for (let i = 0; i < 7; i++) {
      add(p, new THREE.CylinderGeometry(0.15 - i * 0.01, 0.18 - i * 0.01, 0.62, 8), mat(i % 2 ? 0x9c7a52 : 0x8a6a45), [off, y + 0.31, 0], null, [0, 0, -lean * i * 0.05]);
      y += 0.58; off += lean * i * 0.035;
    }
    const top = new THREE.Group(); top.position.set(off, y, 0); p.add(top);
    for (let i = 0; i < 8; i++) {
      const leaf = new THREE.Group(); leaf.rotation.set(0, i / 8 * TAU, 0); top.add(leaf);
      add(leaf, new THREE.ConeGeometry(0.32, 2.4, 4), mat(i % 2 ? 0x3f9a4a : 0x4fae55, { flatShading: true }), [1.05, -0.25, 0], [1, 1, 0.25], [0, 0, -1.9]);
    }
    for (let i = 0; i < 3; i++) add(top, new THREE.SphereGeometry(0.13, 10, 8), mat(0x6b4a2b), [Math.cos(i * 2.1) * 0.2, -0.2, Math.sin(i * 2.1) * 0.2]);
  }
  palm(-6.6, 3.6, 1); palm(6.9, 4.2, -1); palm(7.2, -3.4, 0.8); palm(-7.4, -2.6, -0.6);

  // umbrella + towel
  const ux = -3, uz = -2.4;
  add(g, new THREE.CylinderGeometry(0.04, 0.04, 2.5, 8), mat(0xf4f1ea), [ux, 1.25, uz], null, [0.12, 0, 0]);
  const stripes = canvasTex(256, 32, (x, W, H) => { for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? '#ffffff' : '#e5534b'; x.fillRect(i * W / 8, 0, W / 8, H); } });
  add(g, new THREE.ConeGeometry(1.6, 0.6, 16, 1, true), mat(0xffffff, { map: stripes, side: THREE.DoubleSide }), [ux, 2.45, uz + 0.15], null, [0.12, 0, 0]);
  const towelTex = canvasTex(64, 128, (x, W, H) => { const c = ['#2f8fcf', '#ffffff', '#f2c94c', '#ffffff']; for (let i = 0; i < 8; i++) { x.fillStyle = c[i % 4]; x.fillRect(0, i * H / 8, W, H / 8); } });
  add(g, new THREE.BoxGeometry(1.1, 0.02, 1.9), mat(0xffffff, { map: towelTex, roughness: 1 }), [ux + 0.3, 0.01, uz + 0.7], null, [0, 0.2, 0]);

  // sandcastle
  const castle = new THREE.Group(); castle.position.set(3.4, 0, -1.6); g.add(castle);
  const wet = mat(0xdcbf86, { roughness: 1 });
  add(castle, new THREE.BoxGeometry(1.1, 0.35, 1.1), wet, [0, 0.175, 0]);
  for (const [x, z] of [[-0.5, -0.5], [0.5, -0.5], [-0.5, 0.5], [0.5, 0.5]]) {
    add(castle, new THREE.CylinderGeometry(0.17, 0.2, 0.6, 12), wet, [x, 0.3, z]);
    add(castle, new THREE.ConeGeometry(0.2, 0.25, 12), wet, [x, 0.72, z]);
  }
  add(castle, new THREE.CylinderGeometry(0.2, 0.25, 0.5, 12), wet, [0, 0.6, 0]);
  add(castle, new THREE.BoxGeometry(0.01, 0.15, 0.12), mat(0xe5534b), [0, 1.02, 0.06]);
  add(castle, new THREE.CylinderGeometry(0.008, 0.008, 0.25, 4), mat(0x555555), [0, 0.97, 0]);

  // shells and starfish
  for (let i = 0; i < 14; i++) {
    const x = rand(-HX, HX), z = rand(-HZ, HZ + 3);
    if (Math.hypot(x - 3.4, z + 1.6) < 1.2 || Math.hypot(x - ux, z - uz) < 1.5) continue;
    if (i % 3) add(g, new THREE.SphereGeometry(0.07, 10, 6), mat(i % 2 ? 0xffe4d6 : 0xf6c9a8), [x, 0.015, z], [1, 0.35, 1.2], null, false);
    else for (let a = 0; a < 5; a++) add(g, new THREE.ConeGeometry(0.035, 0.16, 6), mat(0xf28f5c), [x + Math.cos(a / 5 * TAU) * 0.07, 0.015, z + Math.sin(a / 5 * TAU) * 0.07], null, [Math.PI / 2, 0, -a / 5 * TAU + Math.PI / 2], false);
  }
  return {
    group: g, floor, bounds: { hx: HX, hz: HZ }, walls: [],
    obst: [
      { x0: 2.75, x1: 4.05, z0: -2.25, z1: -0.95, h: 0.8 }, // sandcastle
      { x0: ux - 0.15, x1: ux + 0.15, z0: uz - 0.15, z1: uz + 0.15, h: 2.5 }, // umbrella pole
      { x0: -6.95, x1: -6.25, z0: 3.25, z1: 3.95, h: 4 },
      { x0: 6.55, x1: 7.25, z0: 3.85, z1: 4.55, h: 4 },
      { x0: 6.85, x1: 7.55, z0: -3.75, z1: -3.05, h: 4 },
      { x0: -7.75, x1: -7.05, z0: -2.95, z1: -2.25, h: 4 },
    ],
    nap: { x: ux + 0.35, z: uz + 0.85, y: 0.02, where: 'on the beach towel' },
    napAlt: { x: 0.5, z: 2.2, y: 0, where: 'in the warm sand' },
    start: { cats: [[0.6, 1.2, 0.4], [-1.4, 0.4, 1.2]], ball: [1.8, 2.6] },
    cam: [5, 3.8, 8],
    light: { bg: 0x9bd8f0, fog: [0x9bd8f0, 30, 70], hemi: [0xffffff, 0xe8d3a0, 0.8], amb: 0, sun: [0xfff3d6, 1.0, [8, 12, 4]] },
    update(dt, t) {
      const pos = seaGeo.attributes.position.array;
      for (let i = 0; i < pos.length; i += 3) {
        const x = seaBase[i], y = seaBase[i + 1];
        pos[i + 2] = Math.sin(x * 0.35 + t * 1.3) * 0.12 + Math.cos(y * 0.5 + t * 0.9) * 0.1;
      }
      seaGeo.attributes.position.needsUpdate = true;
      seaGeo.computeVertexNormals();
      foam.forEach((f, i) => { f.position.z = -HZ - 0.85 + Math.sin(t * 0.8 + i) * 0.35; f.scale.x = 1 + 0.25 * Math.sin(t * 1.1 + i * 2); });
    },
  };
}

function buildSnow() {

  add(g, new THREE.CircleGeometry(60, 48), mat(0xe4ebf4), [0, -0.01, 0], null, [-Math.PI / 2, 0, 0], false);

  fence(g, R);

  for (let i = 0; i < 24; i++) {

  add(sm, new THREE.ConeGeometry(0.06, 0.32, 10), mat(0xf28c28), [0, 1.98, 0.45], null, [Math.PI / 2, 0, 0]);
  for (const s of [-1, 1]) add(sm, new THREE.SphereGeometry(0.04, 8, 6), coal, [s * 0.12, 2.08, 0.3]);
  for (let i = 0; i < 3; i++) add(sm, new THREE.SphereGeometry(0.045, 8, 6), coal, [0, 1.2 + i * 0.16, 0.47 - Math.abs(i - 1) * 0.02]);
  add(sm, new THREE.TorusGeometry(0.3, 0.07, 8, 20), mat(0xc8553d), [0, 1.72, 0], null, [Math.PI / 2, 0, 0]);
  add(sm, new THREE.BoxGeometry(0.14, 0.4, 0.04), mat(0xc8553d), [0.18, 1.5, 0.3], null, [0, 0, 0.2]);
  add(sm, new THREE.CylinderGeometry(0.22, 0.22, 0.04, 16), coal, [0, 2.27, 0]);
  add(sm, new THREE.CylinderGeometry(0.15, 0.15, 0.3, 16), coal, [0, 2.42, 0]);
  for (const s of [-1, 1]) add(sm, new THREE.CylinderGeometry(0.02, 0.025, 0.8, 5), mat(0x6b4a33), [s * 0.65, 1.5, 0], null, [0, 0, s * 1.0]);
  // lamp post and a plaid blanket to nap on

  add(lamp, new THREE.CylinderGeometry(0.06, 0.09, 2.6, 10), mat(0x2b2b30, { metalness: 0.5, roughness: 0.4 }), [0, 1.3, 0]);
  add(lamp, new THREE.BoxGeometry(0.3, 0.38, 0.3), mat(0xffe3a6, { emissive: 0xffc46b, emissiveIntensity: 0.9 }), [0, 2.75, 0]);
  add(lamp, new THREE.ConeGeometry(0.26, 0.18, 4), mat(0x2b2b30), [0, 3.03, 0], null, [0, Math.PI / 4, 0]);

const PLACES = { yard: buildYard(), bedroom: buildBedroom(), beach: buildBeach(), snow: buildSnow() };

const inside = (x, z, m = 0) => env.bounds.r ? Math.hypot(x, z) < env.bounds.r - m : Math.abs(x) < env.bounds.hx - m && Math.abs(z) < env.bounds.hz - m;
function clampIn(p, m) {
  const b = env.bounds;
  if (b.r) { const r = Math.hypot(p.x, p.z), lim = b.r - m; if (r > lim) { p.x *= lim / r; p.z *= lim / r; } }
  else { p.x = clamp(p.x, -b.hx + m, b.hx - m); p.z = clamp(p.z, -b.hz + m, b.hz - m); }
}
const inObstacle = (x, z, m = 0) => env.obst.some(o => x > o.x0 - m && x < o.x1 + m && z > o.z0 - m && z < o.z1 + m);
// pushes a point out of the furniture; returns the push normal of the last hit, if any
function pushOut(p, r, skip) {
  let n = null;
  for (const o of env.obst) {
    if (skip && skip(o)) continue;
    const cx = clamp(p.x, o.x0, o.x1), cz = clamp(p.z, o.z0, o.z1);
    const dx = p.x - cx, dz = p.z - cz, d = Math.hypot(dx, dz);
    if (d >= r) continue;
    if (d > 1e-5) { p.x = cx + dx / d * r; p.z = cz + dz / d * r; n = [dx / d, dz / d]; }
    else {
      const e = [[p.x - o.x0, -1, 0], [o.x1 - p.x, 1, 0], [p.z - o.z0, 0, -1], [o.z1 - p.z, 0, 1]].sort((a, b) => a[0] - b[0])[0];
      p.x += e[1] * (e[0] + r); p.z += e[2] * (e[0] + r); n = [e[1], e[2]];
    }

}

function furTexture(p) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = p.base; x.fillRect(0, 0, 512, 256);
  // belly sits at u = 0.25 on the rotated sphere

  g.addColorStop(0.08, `rgba(${r},${gg},${b},0)`);

  g.addColorStop(0.3, `rgba(${r},${gg},${b},1)`);

  for (let i = 0; i < p.stripes; i++) {

    x.beginPath();
    for (let u = 230; u <= 560; u += 8) {

}
function legTexture(p) {

const SEG = 11, segL = 0.075;

const cats = COATS.map(makeCat);

// ---------- yarn ball ----------
const BALL_R = 0.17;
const ball = { pos: new THREE.Vector3(2, BALL_R, 2.8), vel: new THREE.Vector3(), stuck: 0 };
const ballMesh = new THREE.Group(); scene.add(ballMesh);
add(ballMesh, new THREE.SphereGeometry(BALL_R, 24, 18), mat(0xffffff, { map: yarnTexture() }));
for (let i = 0; i < 6; i++) add(ballMesh, new THREE.TorusGeometry(BALL_R * 0.99, 0.012, 6, 40), mat(i % 2 ? 0xf27a9a : 0xbf3560), null, null, [rand(0, TAU), rand(0, TAU), 0]);

function kickBall(angle, speed, up) {
  ball.vel.set(Math.sin(angle) * speed, up, Math.cos(angle) * speed);
}
const _axis = new THREE.Vector3();
function updateBall(dt) {
  const p = ball.pos, v = ball.vel;
  v.y -= 9.8 * dt;
  p.addScaledVector(v, dt);
  // walls
  const b = env.bounds;
  if (b.r) {
    const r = Math.hypot(p.x, p.z), lim = b.r - 0.5;
    if (r > lim) {
      const nx = p.x / r, nz = p.z / r;
      p.x = nx * lim; p.z = nz * lim;
      const vn = v.x * nx + v.z * nz;
      if (vn > 0) { v.x -= 1.7 * vn * nx; v.z -= 1.7 * vn * nz; }
    }
  } else {
    for (const [ax, lim] of [['x', b.hx - BALL_R], ['z', b.hz - BALL_R]]) {
      if (Math.abs(p[ax]) > lim) { const s = Math.sign(p[ax]); p[ax] = s * lim; if (v[ax] * s > 0) v[ax] *= -0.7; }
    }
  }
  // furniture: bounce off the sides, or rest on top
  let ground = 0;
  for (const o of env.obst) {
    const cx = clamp(p.x, o.x0, o.x1), cz = clamp(p.z, o.z0, o.z1);
    if (Math.hypot(p.x - cx, p.z - cz) >= BALL_R) continue;
    if (p.y - BALL_R >= o.h - 0.06) { ground = Math.max(ground, o.h); continue; }
    const n = pushOut(p, BALL_R, q => q !== o);
    if (n) { const vn = v.x * n[0] + v.z * n[1]; if (vn < 0) { v.x -= 1.7 * vn * n[0]; v.z -= 1.7 * vn * n[1]; } }
  }
  if (p.y < ground + BALL_R) {
    p.y = ground + BALL_R;
    v.y = Math.abs(v.y) > 0.6 ? -v.y * 0.45 : 0;
  }
  const onSurface = p.y <= ground + BALL_R + 0.001;
  const fr = Math.exp(-(onSurface ? 1.1 : 0.1) * dt);
  v.x *= fr; v.z *= fr;
  // yarn that comes to rest up on furniture rolls back off toward the middle of the room
  if (ground > 0 && onSurface && Math.hypot(v.x, v.z) < 0.4) {
    ball.stuck = (ball.stuck || 0) + dt;
    if (ball.stuck > 1.2) { const l = Math.hypot(p.x, p.z - 1) || 1; v.x = -p.x / l * 2.2; v.z = -(p.z - 1) / l * 2.2; ball.stuck = 0; }
  } else ball.stuck = 0;
  const sp = Math.hypot(v.x, v.z);
  if (sp > 0.001) {
    _axis.set(ball.vel.z, 0, -ball.vel.x).normalize();
    ballMesh.rotateOnWorldAxis(_axis, sp * dt / BALL_R);
  }
  ballMesh.position.copy(ball.pos);
}

// ---------- movement helpers ----------
const angleTo = (k, x, z) => Math.atan2(x - k.root.position.x, z - k.root.position.z);
const distTo = (k, x, z) => Math.hypot(x - k.root.position.x, z - k.root.position.z);
const distBall = k => distTo(k, ball.pos.x, ball.pos.z);
const ballAngle = k => angleTo(k, ball.pos.x, ball.pos.z);

function stepForward(k, dt) {
  k.root.position.x += Math.sin(k.heading) * k.speedSm * dt;
  k.root.position.z += Math.cos(k.heading) * k.speedSm * dt;
}
function coast(k, dt) { k.speedSm = damp(k.speedSm, 0, 8, dt); stepForward(k, dt); }
function turnToward(k, angle, rate, dt) { k.heading += clamp(angDiff(k.heading, angle), -rate * dt, rate * dt); }

function moveToward(k, tx, tz, maxSpeed, dt, turn = 5) {
  const T = k.T;
  const dist = distTo(k, tx, tz);
  const da = angDiff(k.heading, angleTo(k, tx, tz));
  k.heading += clamp(da, -turn * dt, turn * dt);
  const sp = maxSpeed * Math.max(0, Math.cos(da)) * Math.min(1, dist / 0.8 + 0.25);
  k.speedSm = damp(k.speedSm, sp, 6, dt);
  stepForward(k, dt);
  T.roll += clamp(-da * 0.3, -0.22, 0.22) * Math.min(1, k.speedSm / 3);
  T.headYaw += clamp(da * 0.5, -0.6, 0.6);
  return dist;
}

function locoPose(k, speed, dt) {
  if (speed < 0.05) return;
  const T = k.T;
  const run = speed > 2.2;
  const freq = run ? 2.4 + speed * 0.12 : 0.9 + speed * 0.9;
  k.gp += dt * freq * TAU;
  const gp = k.gp;
  const offs = run ? [0, 0.5, Math.PI, Math.PI + 0.5] : [0, Math.PI, Math.PI * 1.5, Math.PI * 0.5];
  const amp = run ? 0.85 : 0.3 + speed * 0.14;
  const kAmp = run ? 1.1 : 0.7;
  for (let i = 0; i < 4; i++) {
    const ph = gp + offs[i];
    T.hip[i] += -amp * Math.sin(ph);
    T.knee[i] += kAmp * Math.max(0, Math.cos(ph));
  }
  if (run) {
    T.y += 0.04 + 0.05 * Math.sin(gp);
    T.pitch += 0.13 * Math.sin(gp + 0.8);
    T.headPitch -= 0.1 * Math.sin(gp + 0.8);
    T.tailBase = -1.35; T.tailCurl = 0.04; T.wag = 0.08; T.ear = 0.35;
  } else {
    T.y += 0.015 * Math.abs(Math.sin(gp));
  }
}

function randomPoint() {
  for (let i = 0; i < 40; i++) {
    const ex = env.bounds.r || env.bounds.hx, ez = env.bounds.r || env.bounds.hz;
    const x = rand(-ex, ex), z = rand(-ez, ez);
    if (inside(x, z, 1.2) && !inObstacle(x, z, 0.7)) return { x, z };
  }
  return { x: 0, z: 1 };
}

// ---------- behaviours ----------
let auto = true;
const INTERRUPTIBLE = ['idle', 'chase', 'zoom', 'stretch', 'tailChase'];

const S = {
  idle: {
    label: 'Watching the yarn',
    enter(k, d) { d.dur = auto ? rand(1.4, 3) : Infinity; },
    update(k, d, dt) {
      const T = k.T;
      coast(k, dt);
      const look = clamp(angDiff(k.heading, ballAngle(k)), -1.1, 1.1);
      T.headYaw = look * 0.9 + 0.15 * Math.sin(d.t * 0.7 + k.idx);
      T.headPitch = -0.08 + 0.06 * Math.sin(d.t * 0.5);
      T.headRoll = 0.12 * Math.sin(d.t * 0.4 + k.idx * 2);
      T.y += 0.006 * Math.sin(d.t * 3);
      T.wag = 0.3; T.wagSpeed = 1.6; T.tailCurl = 0.2;
      if (Math.abs(look) > 1.0) turnToward(k, ballAngle(k), 1.5, dt);
      if (d.t > d.dur) next(k);
    },
  },
  chase: {
    label: 'Chasing the yarn',
    enter(k, d) { d.dur = auto ? rand(5, 8) : 12; },
    update(k, d, dt) {
      const T = k.T;
      const db = distBall(k);
      moveToward(k, ball.pos.x, ball.pos.z, Math.min(3.9, 0.8 + db * 1.4), dt);
      locoPose(k, k.speedSm, dt);
      T.headPitch += 0.15; T.ear -= 0.1;

      if (auto && d.t > 1.5 && db > 2 && db < 4 && Math.random() < dt * 0.5) return setState(k, 'pounce');
      if (d.t > d.dur) next(k);
    },
  },
  bat: {
    label: 'Batting the yarn',
    enter(k, d) { d.hit = false; d.paw = Math.random() < 0.5 ? 0 : 1; d.dur = 0.75; },
    update(k, d, dt) {
      const T = k.T;

  pounce: {
    label: 'Getting ready to pounce',
    enter(k, d) { d.phase = 0; },
    update(k, d, dt) {

        T.hip[2] = T.hip[3] = -0.25 - 0.65 * e; T.knee[2] = T.knee[3] = 0.45 + 1.1 * e;
        T.headPitch = -0.05; T.ear = -0.25; T.tailBase = -1.5; T.tailCurl = 0.25; T.wag = 0.15; T.wagSpeed = 9;
        if (d.t > 0.6) T.roll = 0.09 * Math.sin(d.t * 26);
        if (d.t > 1.2) {
          d.phase = 1; d.t = 0;
          const a = ballAngle(k);
          const dist = clamp(distBall(k) - 0.3, 0.6, 3.4);
          d.sx = pos.x; d.sz = pos.z;
          d.ex = d.sx + Math.sin(a) * dist; d.ez = d.sz + Math.cos(a) * dist;
          d.h = 0.45 + dist * 0.12; d.jt = 0.45 + dist * 0.06;

        pos.y = 4 * d.h * s * (1 - s);
        T.pitch = -0.55 * (1 - 2 * s);
        T.hip[0] = T.hip[1] = -1.25; T.knee[0] = T.knee[1] = 0.15;
        T.hip[2] = T.hip[3] = 1.0; T.knee[2] = T.knee[3] = 0.25;
        T.headPitch = 0.3 * s; T.tailBase = -1.55; T.tailCurl = -0.05; T.ear = 0.3;
        if (s >= 1) { pos.y = 0; d.phase = 2; d.t = 0; }
      } else { // land
        const e = Math.sin(Math.min(1, d.t / 0.45) * Math.PI);
        T.y = 0.62 - 0.12 * e; T.headPitch = 0.35;
        T.hip[0] = T.hip[1] = -0.5 * e; T.knee[0] = T.knee[1] = 0.4 * e;
        if (!d.hit && distBall(k) < 1.0) {

  },
  roll: {
    label: 'Rolling in the grass',
    enter(k, d) {

      // positive roll moves the cat toward its local -x, so pick the sign that heads inward

    },
    update(k, d, dt) {
      const T = k.T, pos = k.root.position;
      coast(k, dt);
      const t = d.t;
      let target;
      if (t < 0.6) target = 0;
      else if (t < 2.4) target = 3 * Math.PI * ease((t - 0.6) / 1.8);
      else if (t < 3.8) target = 3 * Math.PI;

  zoom: {
    label: 'Zoomies!',
    enter(k, d) { d.n = 2 + Math.floor(Math.random() * 3); d.target = randomPoint(); },
    update(k, d, dt) {

      locoPose(k, k.speedSm, dt);

  },
  tailChase: {
    label: 'Chasing its own tail',
    enter(k, d) { d.dir = Math.random() < 0.5 ? 1 : -1; d.dur = rand(2.8, 4); },
    update(k, d, dt) {

      k.heading += d.dir * 5.5 * ramp * dt;

      T.roll += -d.dir * 0.12 * ramp;

      if (d.t > d.dur) next(k);
    },
  },
  stretch: {
    label: 'Big stretch',
    enter(k, d) { d.dur = 2.8; },
    update(k, d, dt) {
      const T = k.T;
      coast(k, dt);
      const e = Math.min(ease(d.t / 0.7), ease((d.dur - d.t) / 0.7));
      T.pitch = 0.32 * e; T.y = 0.62 - 0.1 * e;
      T.hip[0] = T.hip[1] = -1.2 * e; T.knee[0] = T.knee[1] = 0;
      T.hip[2] = T.hip[3] = -0.25 * (1 - e) - 0.32 * e; T.knee[2] = T.knee[3] = 0.45 * (1 - e);
      T.headPitch = -0.55 * e; T.tailBase = -0.55; T.tailCurl = 0.35; T.wag = 0.05;
      if (e > 0.8) T.eyes = 0.08;
      if (d.t > d.dur) next(k);
    },
  },
  nap: {
    label: 'Heading for a nap',
    enter(k, d) {
      const fs = k.friend.state;
      d.inBed = !(fs && fs.name === 'nap' && fs.inBed);
      const alt = env.napAlt;
      d.spot = d.inBed ? env.nap : { x: alt.x + rand(-1, 1), z: alt.z + rand(-0.6, 0.6), y: alt.y, where: alt.where };
      d.phase = 0; d.dur = rand(6, 9);
    },
    update(k, d, dt) {
      const T = k.T;
      if (d.phase === 0) {
        const dist = moveToward(k, d.spot.x, d.spot.z, 2.2, dt, 4);
        locoPose(k, k.speedSm, dt);

          d.phase = 1; d.t = 0;

        }

      }
      coast(k, dt);
      const down = ease(d.t / 0.8);
      T.y = 0.62 - (0.32 - d.spot.y) * down + 0.008 * Math.sin(d.t * 2.2) * down;

        T.knee[i] = T.knee[i] * (1 - down) + (f ? 1.6 : 1.8) * down;

  // playing tag: one cat chases, the other runs away
  chaseFriend: {
    label: k => `Chasing ${k.friend.name}`,
    enter(k, d) {
      d.dur = rand(4, 6);

    update(k, d, dt) {

    },
  },
  flee: {
    label: k => `Running from ${k.friend.name}`,
    enter(k, d) { d.dur = 8; },
    update(k, d, dt) {
      const p = k.root.position, c = k.friend.root.position;
      let ax = p.x - c.x, az = p.z - c.z; const l = Math.hypot(ax, az) || 1; ax /= l; az /= l;
      const t = { x: p.x + ax * 2.5, z: p.z + az * 2.5 };

        const sgn = Math.sin(k.heading) * -az + Math.cos(k.heading) * ax >= 0 ? 1 : -1;

    },
  },
};

function setLabel(k, name) {
  const lab = S[name].label;
  k.statusEl.textContent = typeof lab === 'function' ? lab(k) : lab;
}
function setState(k, name) {
  if (k.state && k.state.name === 'pounce') k.root.position.y = 0;
  k.C.roll = angDiff(0, k.C.roll); // unwind after full rolls
  k.state = { name, t: 0 };
  S[name].enter(k, k.state);
  setLabel(k, name);
}

function next(k) {
  if (!auto) return setState(k, 'idle');
  const db = distBall(k);
  const ballMoving = Math.hypot(ball.vel.x, ball.vel.z) > 0.6;
  const friendFree = INTERRUPTIBLE.includes(k.friend.state.name);
  const w = {
    chase: db > 1 ? 4 : 1,
    bat: db < 0.9 ? 3 : 0,
    pounce: db > 1.6 && db < 4.5 && !ballMoving ? 2.5 : 0,
    roll: 1.2, zoom: 1.1, tailChase: 0.8, stretch: 0.6, idle: ballMoving ? 1.5 : 0.8,
    chaseFriend: friendFree ? 1.0 : 0,
    nap: 0.6,
  };
  // the second cat lets the first get to the yarn more often
  if (k.friend.state.name === 'chase' || k.friend.state.name === 'bat') w.chase *= 0.5;
  if (k.last && ['roll', 'zoom', 'tailChase', 'stretch', 'idle', 'chaseFriend', 'flee', 'nap'].includes(k.last)) w[k.last] = 0;
  let total = 0; for (const n in w) total += w[n];
  let r = Math.random() * total, pick = 'chase';
  for (const n in w) { r -= w[n]; if (r <= 0) { pick = n; break; } }
  k.last = pick;
  setState(k, pick);
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });

// ---------- main loop ----------
function applyPose(k, dt) {
  const C = k.C, T = k.T;
  for (const n in RATES) C[n] = damp(C[n], T[n], RATES[n], dt);
  for (let i = 0; i < 4; i++) {
    C.hip[i] = damp(C.hip[i], T.hip[i], LEG_RATE, dt);
    C.knee[i] = damp(C.knee[i], T.knee[i], LEG_RATE, dt);
    C.side[i] = damp(C.side[i], T.side[i], LEG_RATE, dt);
  }
  k.body.position.y = C.y;
  k.body.rotation.set(C.pitch, 0, C.roll);
  k.neck.rotation.set(C.headPitch, C.headYaw, C.headRoll);
  k.legs.forEach((l, i) => {
    l.hip.rotation.set(C.hip[i], 0, C.side[i]);
    l.knee.rotation.x = C.knee[i];
    l.ankle.rotation.x = -(C.hip[i] + C.knee[i]) * 0.7;
  });
  k.wagPhase += dt * C.wagSpeed;
  k.tailBase.rotation.x = C.tailBase;
  k.tail.forEach((g, i) => {
    g.rotation.x = C.tailCurl;
    g.rotation.z = C.tailSide + C.wag * Math.sin(k.wagPhase * TAU * 0.5 - i * 0.45) * (0.3 + i / SEG);
  });
  k.ears.forEach(({ g, s }) => {
    g.rotation.x = -0.15 - C.ear;
    g.rotation.z = -s * 0.35 - s * C.ear * 0.4 + (k.earTwitch > 0 && s === k.earTwitchSide ? -s * 0.5 : 0);
  });
  k.eyes.forEach(e => { e.scale.y = Math.max(0.06, C.eyes); });
}

function catTick(k, dt) {
  k.T = basePose();
  k.state.t += dt;
  S[k.state.name].update(k, k.state, dt);

  // blinking and ear twitches
  k.blinkT -= dt;
  if (k.blinkT < 0) { k.blinking = 0.13; k.blinkT = rand(1.8, 5); }
  if (k.blinking > 0) { k.blinking -= dt; k.T.eyes = 0.08; }
  if (k.earTwitch > 0) k.earTwitch -= dt;
  else if (Math.random() < dt * 0.25) { k.earTwitch = 0.18; k.earTwitchSide = Math.random() < 0.5 ? 1 : -1; }

  // keep inside the room and out of the furniture
  const pos = k.root.position;
  clampIn(pos, env.bounds.r ? 0.8 : 0.5);
  pushOut(pos, 0.45, o => o.catPass);
  k.root.rotation.y = k.heading;

  // the cat nudges the yarn when it runs or rolls into it
  const dx = ball.pos.x - pos.x, dz = ball.pos.z - pos.z, dd = Math.hypot(dx, dz);
  if (dd < 0.5 && dd > 1e-4 && ball.pos.y < 0.4 && k.state.name !== 'bat') {
    const push = Math.max(1.5, k.speedSm * 1.2);
    ball.vel.x = dx / dd * push; ball.vel.z = dz / dd * push;
    ball.pos.x = pos.x + dx / dd * 0.5; ball.pos.z = pos.z + dz / dd * 0.5;
  }
}

// cats don't walk through each other (unless one is mid-leap)
function separate() {
  const [a, b] = cats, pa = a.root.position, pb = b.root.position;
  if (pa.y > 0.2 || pb.y > 0.2) return;
  const dx = pb.x - pa.x, dz = pb.z - pa.z, d = Math.hypot(dx, dz), min = 0.85;
  if (d < min && d > 1e-4) {
    const push = (min - d) / 2;
    pa.x -= dx / d * push; pa.z -= dz / d * push;
    pb.x += dx / d * push; pb.z += dz / d * push;
  }
}

function setPlace(name) {

  hemi.color.set(L.hemi[0]); hemi.groundColor.set(L.hemi[1]); hemi.intensity = L.hemi[2];
  ambient.intensity = L.amb;

}
let savedPlace = 'bedroom';
try { savedPlace = localStorage.getItem('cat-place') || 'bedroom'; } catch (e) {}
setPlace(savedPlace);
cats.forEach((k, i) => { setState(k, 'idle'); k.state.dur = 1.2 + i * 1.3; });

function frame() {
  const dt = Math.min(0.05, clock.getDelta()) * (reduceMotion ? 0.6 : 1);
  cats.forEach(k => catTick(k, dt));
  separate();
  updateBall(dt);
  cats.forEach(k => applyPose(k, dt));
  if (env.update) env.update(dt, clock.elapsedTime);

  if (followEl.checked) {
    const sel = selected();
    camGoal.set(0, 0, 0);
    sel.forEach(k => camGoal.add(k.root.position));
    camGoal.multiplyScalar(1 / sel.length); camGoal.y = 0.5;
    const before = controls.target.clone();
    controls.target.lerp(camGoal, 1 - Math.exp(-2.5 * dt));
    camera.position.add(controls.target.clone().sub(before));
  }
  controls.update();
  env.walls.forEach(w => { w.g.visible = !w.hide(); });
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
